<head>

  <style>
    html, body { margin: 0; height: 100%; background: #1d1f21; color: #ddd; font: 14px system-ui, sans-serif; }
    #canvas { display: block; width: 100vw; height: 100vh; }
    #status { position: fixed; left: 8px; bottom: 8px; margin: 0; font: 12px monospace; opacity: 0.7; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <pre id="status">loading&</pre>

  <script>
    // Scene configuration. Layout and movement live in src/world.js.
    var SCENE_CONFIG = {
      models: ['ground', 'excavator', 'roller', 'props'],
      camera: { target: [1, 1.8, 0], distance: 16, yaw: 1.35, pitch: 0.18 },
      cameraPresets: {
        1: { target: [1.0, 1.8, 0.0], distance: 14.0, yaw: 1.57, pitch: 0.15, desc: 'Photo 1 (Front View)' },

      testCamera: { eye: [1, 3, 16], target: [1, 2, 0], up: [0, 1, 0] },

  <script src="assets/models/excavator.js"></script>
  <script src="assets/models/roller.js"></script>
